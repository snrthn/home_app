# 生产环境 Docker 部署
# 用法：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# 前置准备：
#   1. 服务器安装 Docker + Docker Compose V2
#   2. MySQL 已就绪（宿主机或外部 RDS，不容器化）
#   3. cp .env.prod.example .env.prod，填写真实值（密钥/密码/连接串）
#   4. SSL 证书放入 nginx/ssl/（fullchain.pem + privkey.pem，见 nginx/ssl/README.md）
#   5. 构建镜像：docker compose --env-file .env.prod -f docker-compose.prod.yml build
#
# 环境变量（.env.prod，参考 .env.prod.example）：
#   DATABASE_URL         - MySQL 连接串（宿主机 MySQL 用 host.docker.internal）
#   JWT_ACCESS_SECRET    - JWT 访问令牌密钥（openssl rand -hex 32）
#   JWT_REFRESH_SECRET   - JWT 刷新令牌密钥（openssl rand -hex 32）
#   CORS_ORIGIN          - CORS 白名单（逗号分隔，同域可留空）
#   ADMIN_PASSWORD       - 初始管理员密码（首次部署填入，容器启动自动建管理员）
#   SMS_SECRET_ENCRYPT_KEY - 短信密钥加密（openssl rand -hex 32）

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: laoma-nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - upload-data:/var/www/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: nest/Dockerfile
    container_name: laoma-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3721
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-3600}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-604800}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - UPLOAD_DIR=/app/uploads
      - SMS_MODE=${SMS_MODE:-mock}
      - SMS_SECRET_ENCRYPT_KEY=${SMS_SECRET_ENCRYPT_KEY:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - WX_MCH_SERIAL=${WX_MCH_SERIAL:-}
      - WX_NOTIFY_URL=${WX_NOTIFY_URL:-}
      - ALIPAY_GATEWAY=${ALIPAY_GATEWAY:-}
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PHONE=${ADMIN_PHONE:-admin}
      - AUTO_DISPATCH_ENABLED=${AUTO_DISPATCH_ENABLED:-true}
      - TZ=Asia/Shanghai
    volumes:
      - upload-data:/app/uploads
      - ./nest/config:/app/nest/config:ro
    expose:
      - "3721"
    # 若 MySQL 在宿主机，需要访问 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: next/Dockerfile
    container_name: laoma-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=/api/v1
      - TZ=Asia/Shanghai
    expose:
      - "3824"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  upload-data:
