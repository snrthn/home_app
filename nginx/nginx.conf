# =====================================================================
# 老马家电 — 生产环境 Nginx 反向代理
# 由 docker-compose.prod.yml 挂载到 /etc/nginx/conf.d/default.conf
# =====================================================================
# 路由规则：
#   /api/       → backend:3721   (REST API /api/v1/* + Swagger /api/docs + 上传 /api/upload)
#   /ws/        → backend:3721   (socket.io WebSocket，path=/ws)
#   /uploads/   → 本地静态卷      (upload-data 共享卷，nginx 直出免回源)
#   /           → frontend:3824   (Next.js SSR)
# ---------------------------------------------------------------------
# SSL 证书放在 ./nginx/ssl/ 下，挂载到 /etc/nginx/ssl/：
#   fullchain.pem  — 证书链
#   privkey.pem   — 私钥
# 可用 Let's Encrypt：certbot certonly --standalone -d 你的域名
# =====================================================================

# ---------- 全局 ----------
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # 文件上传大小限制（头像/封面等）
  client_max_body_size 20m;
  client_body_buffer_size 128k;

  # ---------- Gzip ----------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # ---------- 上游 ----------
  upstream backend {
    server backend:3721;
  }
  upstream frontend {
    server frontend:3824;
  }

  # 通用代理头（减少重复）
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  # ===================================================================
  # HTTP → HTTPS 跳转
  # ===================================================================
  server {
    listen 80;
    server_name _;

    # Let's Encrypt 验证留直通（如用 webroot 方式）
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ===================================================================
  # HTTPS 主服务
  # ===================================================================
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---------- SSL ----------
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全头 ----------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- WebSocket (socket.io, path=/ws) ----------
    # 匹配 /ws/socket.io/... 长连接，需 Upgrade 头
    location /ws/ {
      proxy_pass http://backend;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400s;   # WS 长连接保活 24h
      proxy_send_timeout 86400s;
    }

    # ---------- 上传静态资源 ----------
    # upload-data 卷挂载在 /var/www/uploads，后端写入同卷，nginx 直出免回源
    location /uploads/ {
      alias /var/www/uploads/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ---------- REST API + Swagger + 上传接口 ----------
    # 后端全局前缀 api，版本 v1 → /api/v1/*
    # Swagger 挂在 /api/docs
    # 上传接口 POST /api/upload
    location /api/ {
      proxy_pass http://backend;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # ---------- 前端 Next.js ----------
    location / {
      proxy_pass http://frontend;
      proxy_read_timeout 30s;
      # Next.js HMR/WebSocket（生产 start 模式一般不需要，保留兼容）
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
