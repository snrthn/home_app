name: Deploy

# 触发：推送到 main 自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个生产部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1) 质量门禁：typecheck（阻塞；失败即终止部署，不允许带类型错误上线）
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g pnpm@8.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: 依赖安全扫描
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: 校验提交信息格式（commitlint）
        run: |
          FROM="${{ github.event.before }}"
          # before 为全零（新分支）或不可达（force push / merge commit）时回退到 HEAD~1
          if [ "${FROM}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${FROM}" 2>/dev/null; then
            FROM="HEAD~1"
          fi
          echo "Checking commits from ${FROM} to ${{ github.sha }}"
          npx commitlint --from="${FROM}" --to="${{ github.sha }}" --verbose

  # 2) E2E 门禁：启动 MySQL → 建表 → 种子数据 → 跑端到端测试
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laoma_jiadian
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/laoma_jiadian?connection_limit=10
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_ACCESS_TTL: "3600"
      JWT_REFRESH_TTL: "604800"
      PORT: "3721"
      UPLOAD_DIR: "./uploads"
      LOG_LEVEL: "error"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g pnpm@8.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @laoma/shared build
      - run: pnpm prisma:generate
      - run: pnpm --filter @laoma/backend exec prisma db push --skip-generate
      - run: pnpm --filter @laoma/backend run seed
      - run: pnpm --filter @laoma/backend run seed:categories
      - run: pnpm --filter @laoma/backend run seed:items
      - run: pnpm test:e2e

  # 3) 部署：runner checkout → git archive 打包 → scp 推代码到 ECS → ssh 构建
  #    push-based，避免 ECS 访问 GitHub 的网络问题（国内常 empty reply）
  deploy:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 打包源码（git archive 只含 tracked 文件，自动排除 node_modules/.git/.env）
        run: git archive --format=tar.gz HEAD -o deploy-src.tar.gz
      - name: 上传源码到 ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy-src.tar.gz"
          target: "/tmp/"
      - name: 构建并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            tar -xzf /tmp/deploy-src.tar.gz
            rm -f /tmp/deploy-src.tar.gz
            SKIP_PULL=1 bash scripts/deploy.sh