name: Deploy

# 触发：推送到 main 自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个生产部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1) 质量门禁：typecheck（阻塞；失败即终止部署，不允许带类型错误上线）
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g pnpm@8.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - name: 校验提交信息格式（commitlint）
        run: npx commitlint --from="${{ github.event.before }}" --to="${{ github.sha }}" --verbose

  # 2) 部署：runner checkout → git archive 打包 → scp 推代码到 ECS → ssh 构建
  #    push-based，避免 ECS 访问 GitHub 的网络问题（国内常 empty reply）
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 打包源码（git archive 只含 tracked 文件，自动排除 node_modules/.git/.env）
        run: git archive --format=tar.gz HEAD -o deploy-src.tar.gz
      - name: 上传源码到 ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy-src.tar.gz"
          target: "/tmp/"
      - name: 构建并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            tar -xzf /tmp/deploy-src.tar.gz
            rm -f /tmp/deploy-src.tar.gz
            SKIP_PULL=1 bash scripts/deploy.sh